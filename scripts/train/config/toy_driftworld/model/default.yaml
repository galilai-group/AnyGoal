name: drift_state_predictor
_target_: anygoal.wm.toy_predictors.DriftWorldStatePredictor
state_dim: ${data.state_dim}
action_dim: ${data.action_dim}
action_frameskip: ${data.frameskip}
history_size: ${history_size}
hidden_dim: 256
num_res_blocks: 4
# PushT DriftWorld has no diffusion/drifting-time input; see the report.
time_embed_dim: null
action_embed_dim: 128
dropout: 0.0
activation: silu
norm: layernorm
temperatures: [0.02, 0.05, 0.2]
n_neg: 16
decay: 0.999
rollout_seed: ${seed}
num_rollout_samples: 1
