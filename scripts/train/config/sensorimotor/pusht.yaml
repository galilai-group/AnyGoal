seed: 0
img_size: 224
patch_size: 14
encoder_scale: tiny
num_workers: 24
subdir: pusht_inverse_lambda_30_seed0
artifacts:
  save_resolved_config: true
  log_lightning_hparams: false
  use_external_callbacks: false
  save_model_object: false
  embedding_subset_size: 4096
trainer:
  max_epochs: 10
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0
  val_check_interval: 500
  limit_val_batches: 10
  log_every_n_steps: 25
loader:
  batch_size: 256
  num_workers: ${num_workers}
  persistent_workers: true
  prefetch_factor: 4
  pin_memory: true
optimizer:
  type: AdamW
  lr: 1e-4
  weight_decay: 1e-3
wandb:
  enabled: false
  log_config: false
  config:
    entity: pivashkov-mpi-is
    project: sensorimotor-world-model
    resume: never
    log_model: false
    name: train_pusht_inverse_lambda_30_seed0
validation_monitoring:
  enabled: true
  probe_ridge_alpha: 1.0
wm:
  history_size: 1
  num_preds: 1
  embed_dim: 192
  action_dim: 2
  proprio_dim: 4
  state_dim: 7
predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0
inverse:
  hidden_dim: 256
loss:
  sigreg:
    weight: 0.0
    kwargs:
      knots: 17
      num_proj: 1024
  inverse:
    weight: 30.0
compile:
  enabled: false
data:
  dataset:
    num_steps: 2
    frameskip: 5
    name: pusht_expert_train
    cache_dir: ${oc.env:EXTERNAL_DATA_ROOT,data/external}
    keys_to_load: [pixels, action, proprio, state]
    keys_to_cache: [action, proprio, state]
final_training:
  environment: Push-T
  method: inverse / ours
  seed: 0
