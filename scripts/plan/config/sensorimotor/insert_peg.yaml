model:
  source_root: ${oc.env:SENSORIMOTOR_SOURCE_ROOT,worldmodels/sensorimotor-world-model/planning}
  checkpoint_root: ~/.cache/anygoal/checkpoints/sensorimotor_world_model
  run_name: 20260910_insert_peg_weak_expert_inverse_lambda_1_seed0
  config: ~/.cache/anygoal/checkpoints/sensorimotor_world_model/20260910_insert_peg_weak_expert_inverse_lambda_1_seed0/config.yaml
  checkpoint: ~/.stable_worldmodel/anygoal/sensorimotor_insertpeg.ckpt

dataset:
  root: ${oc.env:SENSORIMOTOR_DATA_ROOT,'~/.stable_worldmodel'}
  keys_to_cache: [action, observation]

world:
  env_name: anygoal/InsertPeg-v0
  max_episode_steps: 50
  terminate_at_goal: true

seed:
  task_base: 0
  policy_base: 0

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5

solver:
  batch_size: 1
  num_samples: 300
  var_scale: 1.0
  n_steps: 30
  topk: 30

eval:
  seeds: [0, 1, 2]
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: insert_peg_weak_expert_train
  save_video: false
  callables:
    - method: set_state
      args:
        state: {value: observation}
    - method: set_evaluation_goal
      args:
        goal_state: {value: goal_observation}

output:
  directory: outputs/planning_insert_peg_20260910/sensorimotor
