defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/OGBCube-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ???
  env_type: single
  ob_type: states
  multiview: false
  width: 224
  height: 224
  visualize_info: false
  terminate_at_goal: true

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache: [action]

seed: 0
variant: dinowm_noprop
policy: anygoal/prejepa_cube
preflight: false

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  # This checkpoint has 196 tokens at patch size 14, so it requires 196x196.
  img_size: 196
  dataset_name: cube_single_expert
  callables:
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel
    - method: set_target_pos
      args:
        cube_id:
          value: 0
          in_dataset: false
        target_pos:
          value: goal_privileged_block_0_pos
        target_quat:
          value: goal_privileged_block_0_quat

output:
  directory: outputs/cube/prejepa_noprop/seed_${seed}
  filename: cube_prejepa_noprop_results.txt
