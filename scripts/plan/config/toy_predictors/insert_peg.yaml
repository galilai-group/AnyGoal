defaults:
  - launcher: local
  - solver: cem
  - override hydra/job_logging: disabled
  - _self_

world:
  env_name: anygoal/InsertPeg-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ???
  width: 224
  height: 224
  terminate_at_goal: true

dataset:
  keys_to_cache: [action, observation]

seed: 0
device: cuda

model:
  checkpoint_path: ???
  config_path: null
  rollout_seed: ${seed}

plan_config:
  horizon: 5
  receding_horizon: 5
  history_len: 3
  action_block: 5

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  dataset_name: insert_peg_weak_expert_train
  callables:
    - method: set_state
      args:
        state: {value: observation}
    - method: set_evaluation_goal
      args:
        goal_state: {value: goal_observation}

output:
  directory: null
  filename: results.txt
  video: false
  save_video: false
  success_criterion: null
  gif_directory: outputs/toy_planning_rollouts

cache_dir: null

hydra:
  run:
    dir: .
  output_subdir: null
