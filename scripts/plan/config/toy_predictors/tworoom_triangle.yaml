defaults:
  - launcher: local
  - solver: cem
  - override hydra/job_logging: disabled
  - _self_

world:
  env_name: anygoal/TwoRoom-Tri-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ???

dataset:
  keys_to_cache: [action, observation, proprio]

seed: 0
device: cuda

model:
  checkpoint_path: ???
  config_path: null

plan_config:
  horizon: 5
  receding_horizon: 5
  history_len: 3
  action_block: 5

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  dataset_name: tworoom_route_test
  callables:
    - method: _set_state
      args:
        state:
          value: proprio
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_proprio

output:
  directory: null
  filename: tworoom_triangle_toy_results.txt
  video: false
  save_video: false
  success_criterion: null
  gif_directory: outputs/toy_planning_rollouts

cache_dir: null

hydra:
  run:
    dir: .
  output_subdir: null
