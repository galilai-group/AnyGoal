defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: anygoal/TwoRoom-Tri-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ???

seed: 0
policy: lewm_tworoom
cache_dir: ~/.stable_worldmodel
model:
  checkpoint: ~/.stable_worldmodel/anygoal/lewm_tworoom.ckpt
model_source_root: ${oc.env:LEWM_SOURCE_ROOT,'~/.cache/anygoal/sources/lewm'}

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache: [action, proprio]

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: tworoom_route_test
  callables:
    - method: _set_state
      args:
        state:
          value: proprio
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_proprio

output:
  directory: outputs/planning_tworoom_triangle/lewm/seed_${seed}
  filename: tworoom_triangle_results.txt
