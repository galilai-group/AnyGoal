# Copy to ~/.config/anygoal/site.yaml and adapt it to the target cluster.
slurm:
  partition: gpuq
  account: null
  constraint: null
  exclude: []
  log_dir: log_slurm
  python_env: /path/to/venv
  max_array_parallel: 8
  presets:
    gpu-smoke:
      qos: fast
      cpus: 4
      memory: 32G
      time: "04:00:00"
      gpus: 1
      gpu_type: h100
    gpu-train:
      qos: bio_ai
      cpus: 8
      memory: 64G
      time: "2-00:00:00"
      gpus: 1
      gpu_type: h100
    gpu-eval:
      qos: bio_ai
      cpus: 5
      memory: 32G
      time: "2-00:00:00"
      gpus: 1
      gpu_type: h100
wandb:
  enabled: false
  entity: null
  project: anygoal
  mode: online
