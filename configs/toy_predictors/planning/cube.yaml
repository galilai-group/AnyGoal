defaults:
  - launcher: local
  - solver: cem
  - override hydra/job_logging: disabled
  - _self_

world:
  env_name: swm/OGBCube-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ???
  env_type: single
  ob_type: states
  multiview: false
  width: 224
  height: 224
  visualize_info: false
  terminate_at_goal: true

dataset:
  keys_to_cache: [action]

seed: 0
device: cuda

model:
  checkpoint_path: ???
  config_path: null

plan_config:
  horizon: 5
  receding_horizon: 5
  history_len: 3
  action_block: 5

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  dataset_name: cube_single_expert
  callables:
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel
    - method: set_target_pos
      args:
        cube_id:
          value: 0
          in_dataset: false
        target_pos:
          value: goal_privileged_block_0_pos
        target_quat:
          value: goal_privileged_block_0_quat

output:
  directory: null
  filename: cube_toy_results.txt
  video: false
  save_video: false
  success_criterion: null
  gif_directory: paper/results/toy_planning_rollouts

cache_dir: null

hydra:
  run:
    dir: .
  output_subdir: null
