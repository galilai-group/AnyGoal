defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: anygoal/TwoRoom-Tri-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ???

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache: [action, proprio]

seed: 0
variant: dinowm_noprop
policy: ~/.stable_worldmodel/checkpoints/tworoom/dinowm_noprop
cache_dir: ~/.stable_worldmodel
preflight: false

plan_config:
  horizon: 5
  receding_horizon: 5
  history_len: 3
  action_block: 5

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 196
  dataset_name: tworoom_route_test
  reverse: false
  early_agent_moving: false
  callables:
    - method: _set_state
      args:
        state:
          value: proprio
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_proprio

output:
  directory: outputs/planning_tworoom_triangle/prejepa/seed_${seed}
  filename: tworoom_triangle_prejepa_results.txt
