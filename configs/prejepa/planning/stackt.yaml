defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: anygoal/StackT-v2
  num_envs: ${eval.num_eval}
  max_episode_steps: ???

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache: [action, proprio, state]

seed: 0
variant: dinowm
policy: pusht/dinowm
preflight: false

plan_config:
  horizon: 5
  receding_horizon: 5
  history_len: 3
  action_block: 5

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 196
  dataset_name: stackt_test
  reverse: false
  early_agent_moving: false
  callables:
    - method: _set_state
      args:
        state:
          value: state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

output:
  directory: outputs/prejepa/${variant}/stackt/seed_${seed}
  filename: stackt_prejepa_results.txt
