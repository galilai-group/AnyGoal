      checkpoint: ${dataset_root}/pusht/lewm_object.ckpt
      planning_config: configs/lewm/planning/pusht.yaml
    cube:
      checkpoint: ${dataset_root}/cube/lewm_object.ckpt
      planning_config: configs/lewm/planning/cube.yaml
    tworoom:
      checkpoint: ${dataset_root}/checkpoints/tworoom/lewm_object.ckpt
      planning_config: configs/lewm/planning/tworoom.yaml
  sensorimotor:
