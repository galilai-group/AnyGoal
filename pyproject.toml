[project]
name = "anygoal"
version = "0.1.0b4"
description = "Benchmarking state-action recombination in world models"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "docs/NOTICE", "docs/THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10,<3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    # Runtime pins follow requirements.txt. Keep CUDA vendor wheels and build
    # tools out of metadata; torch selects its matching CUDA dependencies.
    "stable-worldmodel[env]==0.1.1",
    "h5py==3.16.0",
    "hdf5plugin==6.0.0",
    "huggingface-hub==1.28.0",
    "zstandard==0.25.0",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "tqdm==4.70.0",
    "PyYAML==6.0.3",
    "imageio[ffmpeg]==2.37.2",
    "imageio-ffmpeg==0.6.0",
    "Pillow==11.3.0",
    # Public versions also accept the matching +cu128 wheels.
    "torch==2.9.1",
    "torchvision==0.24.1",
    "triton==3.5.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "pyarrow==20.0.0",
    "pylance==8.0.0",
    "lancedb==0.39.0",
    "lance-namespace==0.8.6",
    "lance-namespace-urllib3-client==0.8.6",
    "gymnasium==1.3.0",
    "mujoco==3.8.1",
    "dm-control==1.0.41",
    "pymunk==7.3.0",
    "einops==0.8.1",
]

[project.scripts]
anygoal = "anygoal.cli:main"

[project.urls]
Repository = "https://github.com/galilai-group/AnyGoal"
Issues = "https://github.com/galilai-group/AnyGoal/issues"

[project.optional-dependencies]
data = []

eval = [
    "diffusers==0.39.0",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "scikit-learn==1.7.2",
    "stable-pretraining==0.1.7",
    "timm==1.0.22",
    "transformers==5.15.1",
    "datasets==4.0.0",
    "fsspec==2025.3.0",
    "dill==0.3.8",
    "multiprocess==0.70.16",
    "lightning==2.6.0",
    "pytorch-lightning==2.6.0",
    "torchmetrics==1.8.2",
    "wandb==0.23.0",
    "protobuf==6.33.1",
    "googleapis-common-protos==1.72.0",
    "opencv-python-headless==5.0.0.93",
]

all = [
    "anygoal[eval]==0.1.0b4",
    "stable-worldmodel[train,env]==0.1.1",
    "accelerate==1.15.0",
]

dev = [
    "build==1.6.1",
    "pytest",
    "ruff",
    "twine",
    "tomli; python_version < '3.11'",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not integration and not matrix_e2e'"
markers = [
    "integration: reduced tests using real environments or native components",
    "matrix_e2e: artifact-backed reduced runs over every supported combination",
]

[tool.ruff]
extend-exclude = ["worldmodels"]
