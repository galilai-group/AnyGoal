[project]
name = "anygoal"
version = "0.1.0"
description = "Benchmarking state-action recombination in world models"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "stable-worldmodel[env,format]>=0.1.1,<0.2.0",
    "h5py",
    "hdf5plugin",
    "numpy",
    "scipy",
    "tqdm",
    "PyYAML>=6",
    "imageio>=2.31",
    "Pillow",
]

[project.scripts]
anygoal = "anygoal.cli:main"

[project.optional-dependencies]
data = []

eval = [
    "diffusers>=0.39,<0.40",
    "hydra-core>=1.3,<2",
    "scikit-learn>=1.7,<2",
    "stable-pretraining>=0.1.7,<0.2",
    "timm>=1,<2",
    "transformers==5.15.1",
]

all = [
    "stable-worldmodel[train,env,format]>=0.1.1,<0.2.0",
    "accelerate>=1.15,<2",
    "diffusers>=0.39,<0.40",
    "hydra-core>=1.3,<2",
    "scikit-learn>=1.7,<2",
    "stable-pretraining>=0.1.7,<0.2",
    "timm>=1,<2",
    "transformers==5.15.1",
    "wandb>=0.23,<0.24",
]

dev = [
    "build==1.6.1",
    "pytest",
    "ruff",
    "twine",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not integration and not matrix_e2e'"
markers = [
    "integration: reduced tests using real environments or native components",
    "matrix_e2e: artifact-backed reduced runs over every supported combination",
]

[tool.ruff]
extend-exclude = ["worldmodels"]
