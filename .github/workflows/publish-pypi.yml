name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish and verify
        required: true
        default: 0.1.0b1
        type: string
      confirmation:
        description: Enter publish-<version> (for example, publish-0.1.0b1)
        required: true
        type: string
      approve_production:
        description: I explicitly approve publishing this version to production PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Validate release intent and version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
          APPROVED: ${{ inputs.approve_production }}
          PUBLISHER: ${{ github.actor }}
        run: |
          test "${PUBLISHER}" = "Hazel-Heejeong-Nam"
          test "${APPROVED}" = "true"
          test "${CONFIRMATION}" = "publish-${EXPECTED_VERSION}"
          actual_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${actual_version}" = "${EXPECTED_VERSION}"
          test "$(python -c 'import runpy; print(runpy.run_path("anygoal/version.py")["__version__"])')" = "${EXPECTED_VERSION}"
      - name: Build and check distributions
        run: |
          uv venv "${RUNNER_TEMP}/release-venv"
          uv pip install --python "${RUNNER_TEMP}/release-venv/bin/python" build twine
          "${RUNNER_TEMP}/release-venv/bin/python" -m build
          "${RUNNER_TEMP}/release-venv/bin/python" -m twine check dist/*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/anygoal
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  smoke-test:
    needs: publish
    runs-on: ubuntu-24.04
    env:
      UV_TORCH_BACKEND: cpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Install from PyPI and smoke test
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          for attempt in {1..12}; do
            bash scripts/smoke_test_published.sh pypi "${PACKAGE_VERSION}" && exit 0
            sleep 15
          done
          exit 1
