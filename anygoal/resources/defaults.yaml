schema_version: 1
paths:
  data: ${ANYGOAL_DATA_ROOT:-~/.stable_worldmodel/datasets}
  checkpoints: ${ANYGOAL_CHECKPOINT_ROOT:-~/.cache/anygoal/checkpoints}
  outputs: ${ANYGOAL_OUTPUT_ROOT:-./outputs}
  sources: ${ANYGOAL_SOURCE_ROOT:-~/.cache/anygoal/sources}
wandb:
  enabled: false
  entity: null
  project: anygoal
  mode: online
  dir: null
  tags: []
  resume: allow
slurm:
  partition: null
  account: null
  constraint: null
  exclude: []
  log_dir: log_slurm
  python_env: null
  max_array_parallel: 8
  presets:
    cpu-small:
      cpus: 2
      memory: 8G
      time: "01:00:00"
      gpus: 0
      qos: null
    gpu-smoke:
      cpus: 4
      memory: 32G
      time: "04:00:00"
      gpus: 1
      gpu_type: h100
      qos: null
    gpu-train:
      cpus: 8
      memory: 64G
      time: "2-00:00:00"
      gpus: 1
      gpu_type: h100
      qos: null
    gpu-eval:
      cpus: 5
      memory: 32G
      time: "2-00:00:00"
      gpus: 1
      gpu_type: h100
      qos: null
