model:
  source_root: null
  checkpoint_root: ${oc.env:SENSORIMOTOR_CHECKPOINT_ROOT,${anygoal.path:checkpoints}/sensorimotor}
  run_name_template: cube_inverse_lambda_1_seed3072
  config: "resource:train/sensorimotor/cube.yaml"
  checkpoint: ${anygoal.path:checkpoints}/sensorimotor_cube.ckpt
  seeds: [0, 1, 2]

dataset:
  root: ${anygoal.path:data}
  keys_to_cache: [action]

world:
  env_name: swm/OGBCube-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: 100
  env_type: single
  ob_type: states
  multiview: false
  width: 224
  height: 224
  visualize_info: false
  terminate_at_goal: true

seed:
  task_base: 0
  policy_base: 0

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5

solver:
  batch_size: 1
  num_samples: 300
  var_scale: 1.0
  n_steps: 30
  topk: 30

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: cube_single_expert
  save_video: false
  callables:
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel
    - method: set_target_pos
      args:
        cube_id:
          value: 0
          in_dataset: false
        target_pos:
          value: goal_privileged_block_0_pos
        target_quat:
          value: goal_privileged_block_0_quat

output:
  directory: ${oc.env:SENSORIMOTOR_OUTPUT_ROOT,${anygoal.path:outputs}/sensorimotor}/cube
