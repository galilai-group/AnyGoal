model:
  source_root: null
  checkpoint_root: ${oc.env:SENSORIMOTOR_CHECKPOINT_ROOT,${anygoal.path:checkpoints}/sensorimotor}
  run_name: pusht_inverse_lambda_30_seed0
  config: "resource:train/sensorimotor/pusht.yaml"
  checkpoint: ${anygoal.path:checkpoints}/sensorimotor_pusht.ckpt

dataset:
  root: ${anygoal.path:data}
  keys_to_cache: [action, proprio, state]

world:
  # StackT and PushT now share the same pusher-and-block success criterion.
  env_name: anygoal/StackT-v2
  max_episode_steps: 100

seed:
  task_base: 0
  policy_base: 0

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5

solver:
  batch_size: 1
  num_samples: 300
  var_scale: 1.0
  n_steps: 30
  topk: 30

eval:
  seeds: [0, 1, 2]
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: stackt_test
  save_video: false
  reverse: false
  early_agent_moving: false
  early_agent_moving_block_threshold: 30.0
  early_agent_moving_stationary_eps: 1.0e-6
  callables:
    - method: _set_state
      args:
        state:
          value: state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

output:
  directory: ${oc.env:SENSORIMOTOR_OUTPUT_ROOT,${anygoal.path:outputs}/sensorimotor}/stackt
