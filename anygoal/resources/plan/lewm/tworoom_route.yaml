defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: anygoal/TwoRoom-Route-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ???

seed: 0
policy: lewm_tworoom
cache_dir: ${anygoal.path:checkpoints}
model:
  action_dim: 2
  checkpoint: ${anygoal.path:checkpoints}/lewm_tworoom.ckpt
model_source_root: ${oc.env:LEWM_SOURCE_ROOT,${anygoal.path:sources}/lewm}

dataset:
  stats: tworoom
  keys_to_cache: [action, proprio]

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: tworoom_route_test
  callables:
    - method: _set_state
      args:
        state:
          value: proprio
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_proprio

output:
  directory: ${anygoal.path:outputs}/planning_tworoom_route/lewm/seed_${seed}
  filename: tworoom_route_results.txt
