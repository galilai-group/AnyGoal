defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: anygoal/CubeHop-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # make sure it's >= eval_budget
  env_type: single
  ob_type: states
  multiview: False
  width: 224
  height: 224
  visualize_info: False
  terminate_at_goal: True
  evaluation_ee_position_tolerance: 0.04
  evaluation_ee_yaw_tolerance: 0.10
  evaluation_cube_position_tolerance: 0.04

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action

seed: 0
policy: cube/lewm # ckpt name or random
model_source_root: ${oc.env:LEWM_SOURCE_ROOT,${anygoal.path:sources}/lewm}
model:
  checkpoint: ${anygoal.path:checkpoints}/lewm_cube.ckpt
  encoder_scale: tiny
  patch_size: 14
  embed_dim: 192
  history_size: 3
  action_dim: 5
  predictor:
    depth: 6
    heads: 16
    mlp_dim: 2048
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5 # frameskip

# evaluation from dataset (replay expert trajectories)
eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: cube_hop_test
  callables:
    # -- set state
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel
    # -- set reporting-only future-state goal
    - method: set_evaluation_goal
      args:
        effector_pos:
          value: goal_proprio_effector_pos
        effector_yaw:
          value: goal_proprio_effector_yaw
        cube_pos:
          value: goal_privileged_block_0_pos

output:
  directory: ${anygoal.path:outputs}/cube_hop/lewm/seed_${seed}
  filename: cube_hop_lewm_results.txt
