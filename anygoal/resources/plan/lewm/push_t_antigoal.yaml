defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: anygoal/PushTAntigoal-v3
  num_envs: ${eval.num_eval}
  max_episode_steps: ???

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio
    - state

seed: 42
policy: random
model_source_root: ${oc.env:LEWM_SOURCE_ROOT,${anygoal.path:sources}/lewm}
model:
  action_dim: 2

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: pusht_antigoal_test
  reverse: false
  early_agent_moving: false
  early_agent_moving_block_threshold: 30.0
  early_agent_moving_stationary_eps: 1.0e-6
  callables:
    - method: _set_state
      args:
        state:
          value: state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

output:
  directory: null
  filename: push_t_antigoal_results.txt
