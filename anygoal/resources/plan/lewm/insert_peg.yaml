defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: anygoal/InsertPeg-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ???
  width: 224
  height: 224
  terminate_at_goal: true

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache: [action, observation]

seed: 0
policy: insert_peg/lewm
model_source_root: ${oc.env:LEWM_SOURCE_ROOT,'~/.cache/anygoal/sources/lewm'}
model:
  checkpoint: ~/.stable_worldmodel/anygoal/lewm_insertpeg.pt
  encoder_scale: tiny
  patch_size: 14
  embed_dim: 192
  history_size: 3
  action_dim: 5
  predictor:
    depth: 6
    heads: 16
    mlp_dim: 2048
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: insert_peg_weak_expert_train
  callables:
    - method: set_state
      args:
        state: {value: observation}
    - method: set_evaluation_goal
      args:
        goal_state: {value: goal_observation}

output:
  directory: outputs/planning_insert_peg_20260911/lewm/seed_${seed}
  filename: results.txt
