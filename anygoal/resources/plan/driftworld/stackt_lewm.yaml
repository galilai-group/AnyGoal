model:
  checkpoint: ${oc.env:DRIFTWORLD_CHECKPOINT,${anygoal.path:checkpoints}/driftworld_pusht.pt}
  unet_name: UNet_PushT
  temp_list: [0.02, 0.05, 0.2]
  n_neg: 16
  num_future_frames: 1
  num_history_frames: 3
  decay: 0.999
  action_frameskip: 5
  action_mode: relative
  rollout_batch_size: 16
  num_rollout_samples: 1
  rollout_seed: 54025
  action_scale: 100.0
  absolute_action_max: 511.0

dataset:
  root: ${anygoal.path:data}
  keys_to_cache: [action, proprio, state]

world:
  env_name: anygoal/StackT-v2
  max_episode_steps: 100

seed:
  task: 44025
  policy: 54025

plan_config:
  horizon: 5
  receding_horizon: 5
  history_len: 3
  action_block: 5
  warm_start: true

solver:
  batch_size: 1
  num_samples: 300
  var_scale: 1.0
  n_steps: 30
  topk: 30

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  render_size: 224
  dataset_name: stackt_test
  callables:
    - method: _set_state
      args:
        state:
          value: state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

output:
  directory: ${oc.env:DRIFTWORLD_OUTPUT_ROOT,${anygoal.path:outputs}/driftworld}/lewm/stackt
  save_video: false
