model:
  checkpoint: ${oc.env:DRIFTWORLD_CUBE_CHECKPOINT,${anygoal.path:checkpoints}/driftworld_cube.pt}
  source: robomimic
  unet_type: multi
  temp_list: [0.02, 0.05, 0.2]
  n_neg: 32
  num_future_frames: 1
  num_history_frames: 3
  decay: 0.999
  action_frameskip: 5
  action_mode: relative
  rollout_batch_size: 16
  num_rollout_samples: 1
  rollout_seed: 0

dataset:
  root: ${anygoal.path:data}
  keys_to_cache: [action]

world:
  env_name: anygoal/CubeHop-v0
  max_episode_steps: 100
  env_type: single
  ob_type: states
  multiview: false
  width: 224
  height: 224
  visualize_info: false
  terminate_at_goal: true
  evaluation_ee_position_tolerance: 0.04
  evaluation_ee_yaw_tolerance: 0.10
  evaluation_cube_position_tolerance: 0.04

seed:
  task: 0
  policy: 0

plan_config:
  horizon: 5
  receding_horizon: 5
  history_len: 3
  action_block: 5
  warm_start: true

solver:
  batch_size: 1
  num_samples: 300
  var_scale: 1.0
  n_steps: 30
  topk: 30

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  render_size: 224
  dataset_name: cube_hop_test
  callables:
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel
    - method: set_evaluation_goal
      args:
        effector_pos:
          value: goal_proprio_effector_pos
        effector_yaw:
          value: goal_proprio_effector_yaw
        cube_pos:
          value: goal_privileged_block_0_pos

output:
  directory: ${oc.env:DRIFTWORLD_OUTPUT_ROOT,${anygoal.path:outputs}/driftworld}/cube_hop
  save_video: false
