model:
  checkpoint: ~/.stable_worldmodel/anygoal/irasim_insertpeg.pt
  vae_model_path: stabilityai/stable-diffusion-xl-base-1.0
  vae_subfolder: vae
  scheduler_path: ~/.cache/anygoal/sources/IRASim/pretrained_models/scheduler
  beta_start: 0.0001
  beta_end: 0.02
  beta_schedule: linear
  variance_type: learned_range
  inference_steps: 50
  guidance_scale: 1.0
  action_frameskip: 5
  num_history_frames: 3
  rollout_batch_size: 1
  num_rollout_samples: 1
  rollout_seed: 0
  cost_type: pixel_mse

dataset:
  root: ~/.stable_worldmodel
  keys_to_cache: [action]
  action_stats_name: manipulator_insert_peg_weak_expert_train

world:
  env_name: anygoal/InsertPeg-v0
  max_episode_steps: 50
  terminate_at_goal: true

seed: {task: 0, policy: 0}

plan_config:
  horizon: 5
  receding_horizon: 5
  history_len: 3
  action_block: 5
  warm_start: true

solver:
  batch_size: 1
  num_samples: 16
  var_scale: 1.0
  n_steps: 2
  topk: 4

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  render_size: 224
  dataset_name: manipulator_insert_peg_weak_expert_train
  callables:
    - method: set_state
      args:
        state: {value: observation}
    - method: set_evaluation_goal
      args:
        goal_state: {value: goal_observation}

output:
  directory: outputs/planning_irasim_insert_peg
  save_video: false
