model:
  checkpoint: ${anygoal.path:checkpoints}/irasim_cube.pt
  vae_model_path: stabilityai/stable-diffusion-xl-base-1.0
  vae_subfolder: vae
  scheduler_path: ${anygoal.path:sources}/IRASim/pretrained_models/scheduler
  beta_start: 0.0001
  beta_end: 0.02
  beta_schedule: linear
  variance_type: learned_range
  inference_steps: 50
  guidance_scale: 1.0
  action_frameskip: 5
  num_history_frames: 3
  rollout_batch_size: 1
  num_rollout_samples: 1
  rollout_seed: 0
  cost_type: pixel_mse

dataset:
  root: ${anygoal.path:data}
  action_stats_name: cube_single_expert
  keys_to_cache: [action]

world:
  env_name: anygoal/CubeDiagonal-v0
  max_episode_steps: 100
  env_type: single
  ob_type: states
  multiview: false
  width: 224
  height: 224
  visualize_info: false
  terminate_at_goal: true

seed: {task: 0, policy: 0}

plan_config: {horizon: 5, receding_horizon: 5, history_len: 3, action_block: 5, warm_start: true}
solver: {batch_size: 1, num_samples: 16, var_scale: 1.0, n_steps: 2, topk: 4}

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  render_size: 224
  dataset_name: cube_diagonal_test
  callables:
    - method: set_state
      args:
        qpos: {value: qpos}
        qvel: {value: qvel}
    - method: set_evaluation_goal
      args:
        effector_pos: {value: goal_proprio_effector_pos}
        effector_yaw: {value: goal_proprio_effector_yaw}
        cube_pos: {value: goal_privileged_block_0_pos}

output:
  directory: ${anygoal.path:outputs}/planning_cube_diagonal_20260910/irasim
  save_video: false
