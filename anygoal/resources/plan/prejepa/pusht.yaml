defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/PushT-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ???

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache: [action, proprio, state]

seed: 0
variant: dinowm
policy: anygoal/prejepa_pusht
preflight: false

plan_config:
  horizon: 5
  receding_horizon: 5
  history_len: 3
  action_block: 5

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 196
  dataset_name: pusht_expert_train
  reverse: false
  early_agent_moving: false
  callables:
    - method: _set_state
      args:
        state:
          value: state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

output:
  directory: ${anygoal.path:outputs}/prejepa/${variant}/pusht/seed_${seed}
  filename: pusht_prejepa_results.txt
