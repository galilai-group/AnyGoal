defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: anygoal/CubeDiagonal-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: 100
  env_type: single
  ob_type: states
  multiview: false
  width: 224
  height: 224
  visualize_info: false
  terminate_at_goal: true
  evaluation_ee_position_tolerance: 0.04
  evaluation_ee_yaw_tolerance: 0.10
  evaluation_cube_position_tolerance: 0.04

dataset:
  stats: cube_single_expert
  keys_to_cache: [action]

seed: 0
variant: dinowm_noprop
policy: anygoal/prejepa_cube
preflight: false
plan_config: {horizon: 5, receding_horizon: 5, action_block: 5}

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 196
  dataset_name: cube_diagonal_test
  callables:
    - method: set_state
      args:
        qpos: {value: qpos}
        qvel: {value: qvel}
    - method: set_evaluation_goal
      args:
        effector_pos: {value: goal_proprio_effector_pos}
        effector_yaw: {value: goal_proprio_effector_yaw}
        cube_pos: {value: goal_privileged_block_0_pos}

output:
  directory: ${anygoal.path:outputs}/planning_cube_diagonal/prejepa/seed_${seed}
  filename: cube_diagonal_prejepa_results.txt
