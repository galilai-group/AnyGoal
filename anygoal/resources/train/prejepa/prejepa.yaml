defaults:
  - _self_
  - launcher: local

hydra:
  job:
    chdir: true

output_model_name: pusht_${backbone.type}_p${predictor.size}
subdir: null
seed: 42

dataset_name: pusht_expert_train.h5
n_steps: ${eval:'${wm.num_preds} + ${wm.history_size}'}
frameskip: 5
batch_size: 32
num_workers: 16
train_split: 0.9

backbone:
  name: dinov2_small
  type: dinov2_small
  is_video_encoder: false
  interpolate_pos_encoding: true

image_size: 224
patch_size: 14

wm:
  history_size: 3
  num_preds: 1
  encoding:
    proprio: 10
    action: 10

predictor:
  size: small
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

model:
  _target_: stable_worldmodel.wm.PreJEPA
  history_size: ${wm.history_size}
  num_pred: ${wm.num_preds}
  interpolate_pos_encoding: ${backbone.interpolate_pos_encoding}
  encoder:
    _target_: stable_worldmodel.wm.prejepa.module.create_backbone
    name: ${backbone.name}
  predictor:
    _target_: stable_worldmodel.wm.prejepa.module.CausalPredictor
    num_patches: ???
    num_frames: ${wm.history_size}
    dim: ???
    depth: ${predictor.depth}
    heads: ${predictor.heads}
    mlp_dim: ${predictor.mlp_dim}
    dim_head: ${predictor.dim_head}
    dropout: ${predictor.dropout}
    emb_dropout: ${predictor.emb_dropout}

optimizer:
  type: AdamW
  lr: 5e-4
  weight_decay: 0.0

trainer:
  max_epochs: 10
  strategy: ddp
  devices: auto
  accelerator: gpu
  precision: 16-mixed
  gradient_clip_val: 1.0
