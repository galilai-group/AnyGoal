defaults:
  - data: pusht
  - model: default
  - override hydra/job_logging: disabled
  - _self_

seed: 1
history_size: 3
num_preds: 1
train_split: 0.9

resume_checkpoint: null

loader:
  batch_size: 128
  num_workers: 6
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true

optimizer:
  lr: 1.25e-5
  beta2: 0.95
  weight_decay: 0.01
  warmup_steps: 500
  grad_clip: 2.0

train:
  num_epochs: 50
  max_steps: 500000
  log_every_steps: 10
  checkpoint_every_steps: null

output:
  checkpoint_root: ${anygoal.path:checkpoints}/toy_driftworld
  description: ${data.name}_${model.name}

wandb:
  enabled: true
  entity: ${oc.env:WANDB_ENTITY,null}
  project: ${oc.env:WANDB_PROJECT,anygoal-toy-driftworld}
  name: ${data.name}_${model.name}

hydra:
  run:
    dir: .
  output_subdir: null
