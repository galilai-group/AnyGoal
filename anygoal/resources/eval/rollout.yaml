protocol:
  history_length: 3
  frame_skip: 5
  horizons: [15, 25]
  num_episodes: 100
  batch_size: 32

dataset_root: ${anygoal.path:data}

datasets:
  pusht:
    path: ${dataset_root}/pusht_expert_train.h5
    dataset_name: pusht_expert_train
    base_environment: pusht
    variant_identifier: base
  avoidt:
    path: ${dataset_root}/avoidt_test.h5
    dataset_name: avoidt_test
    base_environment: pusht
    variant_identifier: avoidt
  stackt:
    path: ${dataset_root}/stackt_test.h5
    dataset_name: stackt_test
    base_environment: pusht
    variant_identifier: stackt_v2
  pusht_antigoal:
    path: ${dataset_root}/pusht_antigoal_test.h5
    dataset_name: pusht_antigoal_test
    base_environment: pusht
    variant_identifier: pusht_antigoal_v3
  cube:
    path: ${dataset_root}/cube_single_expert.h5
    dataset_name: cube_single_expert
    base_environment: cube
    variant_identifier: base
  cubehop:
    path: ${dataset_root}/cube_hop_test.h5
    dataset_name: cube_hop_test
    base_environment: cube
    variant_identifier: cubehop
  cube_diagonal:
    path: ${dataset_root}/cube_diagonal_test.h5
    dataset_name: cube_diagonal_test
    base_environment: cube
    variant_identifier: cube_diagonal
  tworoom:
    path: ${dataset_root}/tworoom.h5
    dataset_name: tworoom
    base_environment: tworoom
    variant_identifier: base
  tworoom_route:
    path: ${dataset_root}/tworoom_route_test.h5
    dataset_name: tworoom_route_test
    base_environment: tworoom
    variant_identifier: triangles
  insert_peg:
    path: ${dataset_root}/manipulator_insert_peg_weak_expert_train.h5
    dataset_name: manipulator_insert_peg_weak_expert_train
    base_environment: insert_peg
    variant_identifier: base
  avoid_peg:
    path: ${dataset_root}/avoid_peg_test.h5
    dataset_name: avoid_peg_test
    base_environment: insert_peg
    variant_identifier: avoid_peg
  extract_peg:
    path: ${dataset_root}/extract_peg_test.h5
    dataset_name: extract_peg_test
    base_environment: insert_peg
    variant_identifier: extract_peg

models:
  lewm:
    insert_peg:
      checkpoint: ${anygoal.path:checkpoints}/lewm_insertpeg.pt
      planning_config: plan/lewm/insert_peg.yaml
    pusht:
      checkpoint: ${anygoal.path:checkpoints}/lewm_pusht.ckpt
      planning_config: plan/lewm/pusht.yaml
    cube:
      checkpoint: ${anygoal.path:checkpoints}/lewm_cube.ckpt
      planning_config: plan/lewm/cube.yaml
    tworoom:
      checkpoint: ${anygoal.path:checkpoints}/lewm_tworoom.ckpt
      planning_config: plan/lewm/tworoom.yaml
  sensorimotor:
    insert_peg:
      checkpoint: ${anygoal.path:checkpoints}/sensorimotor_insertpeg.ckpt
      training_config: resource:train/sensorimotor/insert_peg.yaml
      planning_config: plan/sensorimotor/insert_peg.yaml
    pusht:
      checkpoint: ${anygoal.path:checkpoints}/sensorimotor_pusht.ckpt
      training_config: resource:train/sensorimotor/pusht.yaml
      planning_config: plan/sensorimotor/pusht.yaml
    cube:
      checkpoint: ${anygoal.path:checkpoints}/sensorimotor_cube.ckpt
      training_config: resource:train/sensorimotor/cube.yaml
      planning_config: plan/sensorimotor/cube.yaml
    tworoom:
      checkpoint: ${anygoal.path:checkpoints}/sensorimotor_tworoom.ckpt
      training_config: resource:train/sensorimotor/tworoom.yaml
      planning_config: plan/sensorimotor/tworoom.yaml
  prejepa:
    insert_peg:
      checkpoint: ${anygoal.path:checkpoints}/prejepa_insertpeg.pt
      planning_config: plan/prejepa/insert_peg.yaml
    pusht:
      checkpoint: ${anygoal.path:checkpoints}/prejepa_pusht_object.ckpt
      planning_config: plan/prejepa/pusht.yaml
    cube:
      checkpoint: ${anygoal.path:checkpoints}/prejepa_cube_object.ckpt
      planning_config: plan/prejepa/cube.yaml
    tworoom:
      checkpoint: ${anygoal.path:checkpoints}/prejepa_tworoom_object.ckpt
      planning_config: plan/prejepa/tworoom.yaml
  adaln_predictor:
    insert_peg:
      checkpoint: ${anygoal.path:checkpoints}/toy-adaln_insertpeg.pt
      training_config: resource:eval/training/toy/adaln/insertpeg.yaml
    pusht:
      checkpoint: ${anygoal.path:checkpoints}/toy-adaln_pusht.pt
      training_config: resource:eval/training/toy/adaln/pusht.yaml
    cube:
      checkpoint: ${anygoal.path:checkpoints}/toy-adaln_cube.pt
      training_config: resource:eval/training/toy/adaln/cube.yaml
    tworoom:
      checkpoint: ${anygoal.path:checkpoints}/toy-adaln_tworoom.pt
      training_config: resource:eval/training/toy/adaln/tworoom.yaml
  action_duplicated_predictor:
    insert_peg:
      checkpoint: ${anygoal.path:checkpoints}/toy-action-duplicate_insertpeg.pt
      training_config: resource:eval/training/toy/action_duplicate/insertpeg.yaml
    pusht:
      checkpoint: ${anygoal.path:checkpoints}/toy-action-duplicate_pusht.pt
      training_config: resource:eval/training/toy/action_duplicate/pusht.yaml
    cube:
      checkpoint: ${anygoal.path:checkpoints}/toy-action-duplicate_cube.pt
      training_config: resource:eval/training/toy/action_duplicate/cube.yaml
    tworoom:
      checkpoint: ${anygoal.path:checkpoints}/toy-action-duplicate_tworoom.pt
      training_config: resource:eval/training/toy/action_duplicate/tworoom.yaml
  toy_driftworld:
    insert_peg:
      checkpoint: ${anygoal.path:checkpoints}/toy-driftworld_insertpeg.pt
      training_config: resource:eval/training/toy/driftworld/insertpeg.yaml
    pusht:
      checkpoint: ${anygoal.path:checkpoints}/toy-driftworld_pusht.pt
      training_config: resource:eval/training/toy/driftworld/pusht.yaml
    cube:
      checkpoint: ${anygoal.path:checkpoints}/toy-driftworld_cube.pt
      training_config: resource:eval/training/toy/driftworld/cube.yaml
    tworoom:
      checkpoint: ${anygoal.path:checkpoints}/toy-driftworld_tworoom.pt
      training_config: resource:eval/training/toy/driftworld/tworoom.yaml
  driftworld:
    insert_peg:
      checkpoint: ${anygoal.path:checkpoints}/driftworld_insertpeg.pt
      planning_config: plan/driftworld/insert_peg_lewm.yaml
    pusht:
      checkpoint: ${anygoal.path:checkpoints}/driftworld_pusht.pt
      planning_config: plan/driftworld/pusht_lewm.yaml
    cube:
      checkpoint: ${anygoal.path:checkpoints}/driftworld_cube.pt
      planning_config: plan/driftworld/cube_lewm.yaml
    tworoom:
      checkpoint: ${anygoal.path:checkpoints}/driftworld_tworoom.pt
      planning_config: plan/driftworld/tworoom_lewm.yaml
  irasim:
    insert_peg:
      checkpoint: ${anygoal.path:checkpoints}/irasim_insertpeg.pt
      planning_config: plan/irasim/insert_peg.yaml
      vae_model_path: stabilityai/stable-diffusion-xl-base-1.0
    pusht:
      checkpoint: ${anygoal.path:checkpoints}/irasim_pusht.pt
      planning_config: plan/irasim/pusht.yaml
      vae_model_path: stabilityai/stable-diffusion-xl-base-1.0
    cube:
      checkpoint: ${anygoal.path:checkpoints}/irasim_cube.pt
      planning_config: plan/irasim/cube.yaml
      vae_model_path: stabilityai/stable-diffusion-xl-base-1.0
    tworoom:
      checkpoint: ${anygoal.path:checkpoints}/irasim_tworoom.pt
      planning_config: plan/irasim/tworoom.yaml
      vae_model_path: stabilityai/stable-diffusion-xl-base-1.0

output_root: ${anygoal.path:outputs}/rollout_eval
