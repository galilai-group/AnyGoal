schema_version: 1

datasets:
  pusht:
    aliases: [push_t]
    family: pusht
    filename: pusht_expert_train.h5
    environment: swm/PushT-v1
    evaluation_id: pusht
    config_stem: pusht
    schema: stable-worldmodel-hdf5-v1
    source: import
  avoidt:
    aliases: [avoid_t]
    family: pusht
    filename: avoidt_test.h5
    environment: anygoal/AvoidT-v1
    evaluation_id: avoidt
    config_stem: avoidt
    schema: stable-worldmodel-hdf5-v1
    source: generated
    collector: scripts/collect_avoidt.py
    default_seed: 0
  stackt:
    aliases: [stack_t]
    family: pusht
    filename: stackt_test.h5
    environment: anygoal/StackT-v2
    evaluation_id: stackt
    config_stem: stackt
    planning_stems: {irasim: stackt_v2}
    schema: stable-worldmodel-hdf5-v1
    source: generated
    collector: scripts/collect_stackt_v2.py
    default_seed: 0
  pusht-antigoal:
    aliases: [pusht_antigoal, push_t_antigoal]
    family: pusht
    filename: pusht_antigoal_test.h5
    environment: anygoal/PushTAntigoal-v3
    evaluation_id: pusht_antigoal
    config_stem: push_t_antigoal
    planning_stems: {irasim: push_t_antigoal_v3}
    schema: stable-worldmodel-hdf5-v1
    source: generated
    collector: scripts/collect_push_t_antigoal_v3.py
    default_seed: 0
  cube:
    aliases: [cube_single]
    family: cube
    filename: cube_single_expert.h5
    environment: ogbench/cube-single-play-v0
    evaluation_id: cube
    config_stem: cube
    schema: stable-worldmodel-hdf5-v1
    source: import
  cubehop:
    aliases: [cube_hop]
    family: cube
    filename: cube_hop_test.h5
    environment: anygoal/CubeHop-v0
    evaluation_id: cubehop
    config_stem: cube_hop
    schema: stable-worldmodel-hdf5-v1
    source: generated
    collector: scripts/collect_cube_hop.py
    default_seed: 0
  cubediagonal:
    aliases: [cube_diagonal]
    family: cube
    filename: cube_diagonal_test.h5
    environment: anygoal/CubeDiagonal-v0
    evaluation_id: cube_diagonal
    config_stem: cube_diagonal
    schema: stable-worldmodel-hdf5-v1
    source: generated
    collector: scripts/collect_cube_diagonal.py
    default_seed: 10000
  insertpeg:
    aliases: [manipulator_insert_peg]
    family: manipulator
    filename: manipulator_insert_peg_weak_expert_train.h5
    environment: anygoal/ManipulatorInsertPeg-v0
    evaluation_id: manipulator_insert_peg
    config_stem: manipulator_insert_peg
    schema: stable-worldmodel-hdf5-v1
    source: import
  hug_box:
    aliases: [hug-box, manipulator_hug_box]
    family: manipulator
    filename: avoid_peg_test.h5
    environment: anygoal/ManipulatorInsertPeg-v0
    evaluation_id: manipulator_hug_box
    config_stem: manipulator_insert_peg
    schema: stable-worldmodel-hdf5-v1
    source: generated
    collector: scripts/collect_manipulator_hug_box.py
    default_seed: 20260914
  extractpeg:
    aliases: [extract-peg, manipulator_extract_peg]
    family: manipulator
    filename: extract_peg_test.h5
    environment: anygoal/ManipulatorInsertPeg-v0
    evaluation_id: manipulator_extract_peg
    config_stem: manipulator_insert_peg
    schema: stable-worldmodel-hdf5-v1
    source: generated
    collector: scripts/collect_manipulator_extract_peg.py
    default_seed: 20260915
  tworoom:
    aliases: [two_room]
    family: tworoom
    filename: tworoom.h5
    environment: swm/TwoRoom-v1
    evaluation_id: tworoom
    config_stem: tworoom
    schema: stable-worldmodel-hdf5-v1
    source: import
  tworoom_route:
    aliases: [tworoom-route, tworoom_triangle, tworoom_triangles, tworoom_route_test]
    family: tworoom
    filename: tworoom_route_test.h5
    environment: anygoal/TwoRoom-Tri-v1
    evaluation_id: tworoom_route
    config_stem: tworoom_triangle
    schema: stable-worldmodel-hdf5-v1
    source: generated
    collector: scripts/collect_tworoom_triangle.py
    default_seed: 0

models:
  lewm:
    aliases: []
    capabilities: [train, predict, plan]
    families: [pusht, cube, tworoom, manipulator]
    evaluation_id: lewm
    trainer: scripts/train_lewm.py
    predictor: scripts/eval.py
    planner: scripts/planning_lewm.py
    trainer_config_style: hydra
    planning_config_dir: lewm
    planner_config_style: hydra
    planner_seed_style: override
  sensorimotor:
    aliases: [sensorimotor_wm]
    capabilities: [train, predict, plan]
    families: [pusht, cube, tworoom, manipulator]
    evaluation_id: sensorimotor
    trainer: scripts/train_sensorimotor.py
    predictor: scripts/eval.py
    planner: scripts/planning_sensorimotor.py
    trainer_config_style: hydra
    training_config_dir: sensorimotor/train
    planning_config_dir: sensorimotor
    planner_config_style: argparse
    planner_seed_style: argparse
  prejepa:
    aliases: [dino-wm, dinowm]
    capabilities: [train, predict, plan]
    families: [pusht, cube, tworoom, manipulator]
    evaluation_id: prejepa
    trainer: scripts/train_prejepa_manipulator_insert_peg.py
    predictor: scripts/eval.py
    planner: scripts/planning_prejepa.py
    trainer_config_style: hydra
    planning_config_dir: prejepa
    planner_config_style: hydra
    planner_seed_style: override
  driftworld:
    aliases: [driftworldmodel]
    capabilities: [train, predict, plan]
    families: [pusht, cube, tworoom, manipulator]
    evaluation_id: driftworld
    trainer: scripts/train_driftworld.py
    predictor: scripts/eval.py
    planner: scripts/planning_driftworld.py
    training_config_dir: driftworld/train
    training_config_suffix: _lewm
    trainer_config_style: argparse
    planning_config_dir: driftworld
    planning_config_suffix: _lewm
    planner_config_style: argparse
    planner_seed_style: triple
  irasim:
    aliases: []
    capabilities: [train, predict, plan]
    families: [pusht, cube, tworoom, manipulator]
    evaluation_id: irasim
    trainer: scripts/train_irasim.py
    predictor: scripts/eval.py
    planner: scripts/planning_irasim.py
    training_config_dir: irasim/train
    trainer_config_style: argparse
    planning_config_dir: irasim
    planner_config_style: argparse
    planner_seed_style: triple
  toy-adaln:
    aliases: [adaln, adaln_predictor]
    capabilities: [train, predict, plan]
    families: [pusht, cube, tworoom, manipulator]
    evaluation_id: adaln_predictor
    trainer: scripts/train_toy_predictor.py
    predictor: scripts/eval.py
    planner: scripts/planning_toy.py
    trainer_config_style: hydra
    planning_config_dir: toy_predictors
    planner_config_style: hydra
    planner_seed_style: override
    planning_checkpoint_key: model.checkpoint_path
  toy-action-duplicate:
    aliases: [action_duplicate, action_duplicated_predictor]
    capabilities: [train, predict, plan]
    families: [pusht, cube, tworoom, manipulator]
    evaluation_id: action_duplicated_predictor
    trainer: scripts/train_toy_predictor.py
    predictor: scripts/eval.py
    planner: scripts/planning_toy.py
    trainer_config_style: hydra
    planning_config_dir: toy_predictors
    planner_config_style: hydra
    planner_seed_style: override
    planning_checkpoint_key: model.checkpoint_path
  toy-driftworld:
    aliases: [toy_driftworld]
    capabilities: [train, predict, plan]
    families: [pusht, cube, tworoom, manipulator]
    evaluation_id: toy_driftworld
    trainer: scripts/train_toy_driftworld.py
    predictor: scripts/eval.py
    planner: scripts/planning_toy.py
    trainer_config_style: hydra
    planning_config_dir: toy_predictors
    planner_config_style: hydra
    planner_seed_style: override
    planning_checkpoint_key: model.checkpoint_path

visualizers:
  dataset-gif:
    description: Render frames from an HDF5 dataset as a GIF.
    required_inputs: [dataset HDF5 containing pixels]
    optional_inputs: [episode index, start frame, frame count, fps]
    output: .gif
  metrics-plot:
    description: Plot scalar values from a prediction, planning, or analysis metrics JSON.
    required_inputs: [metrics JSON containing numeric leaves]
    optional_inputs: [title]
    output: .png
  counterfactual-grid:
    description: Plot the registered counterfactual action and response grids.
    required_inputs: [counterfactual result artifact]
    optional_inputs: [model label, dataset label]
    output: .png
    runner: anygoal.evaluation.plot_counterfactual_grids
    input_option: --input-root
    output_option: --output-directory
