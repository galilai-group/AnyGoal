schema_version: 1

datasets:
  pusht:
    aliases: [push_t]
    family: pusht
    filename: pusht_expert_train.h5
    environment: swm/PushT-v1
    evaluation_id: pusht
    config_stem: pusht
    schema: stable-worldmodel-hdf5-v1
    source: external
  avoidt:
    aliases: [avoid_t]
    family: pusht
    filename: avoidt_test.h5
    environment: anygoal/AvoidT-v1
    evaluation_id: avoidt
    config_stem: avoidt
    schema: stable-worldmodel-hdf5-v1
    source: generated
    collector: anygoal.collections.avoidt
    default_seed: 0
  stackt:
    aliases: [stack_t]
    family: pusht
    filename: stackt_test.h5
    environment: anygoal/StackT-v2
    evaluation_id: stackt
    config_stem: stackt
