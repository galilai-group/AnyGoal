    config_stem: tworoom_triangle
    schema: stable-worldmodel-hdf5-v1
    source: generated
    collector: anygoal.collections.tworoom_triangle
    default_seed: 0

models:
  lewm:
    aliases: []
    capabilities: [train, predict, plan]
    families: [pusht, cube, tworoom, insert_peg]
    evaluation_id: lewm
    trainer: scripts/train/train_lewm.py
    predictor: scripts/eval/eval.py
    planner: scripts/plan/planning_lewm.py
    trainer_config_style: hydra
    training_profiles:
      pusht: null
      cube: null
      tworoom: null
      insertpeg: null
    planning_config_dir: lewm
    planner_config_style: hydra
    planner_seed_style: override
  sensorimotor:
    aliases: [sensorimotor_wm]
    capabilities: [train, predict, plan]
    families: [pusht, cube, tworoom, insert_peg]
    evaluation_id: sensorimotor
    trainer: scripts/train/train_sensorimotor.py
    predictor: scripts/eval/eval.py
    planner: scripts/plan/planning_sensorimotor.py
    trainer_config_style: hydra
    training_profiles:
      pusht: scripts/train/config/sensorimotor/pusht.yaml
      cube: scripts/train/config/sensorimotor/cube.yaml
      tworoom: scripts/train/config/sensorimotor/tworoom.yaml
      insertpeg: scripts/train/config/sensorimotor/insert_peg.yaml
    training_config_dir: sensorimotor
    planning_config_dir: sensorimotor
    planner_config_style: argparse
    planner_seed_style: argparse
  prejepa:
    aliases: [dino-wm, dinowm]
    capabilities: [train, predict, plan]
    families: [pusht, cube, tworoom, insert_peg]
    evaluation_id: prejepa
    trainer: scripts/train/train_prejepa.py
    predictor: scripts/eval/eval.py
    planner: scripts/plan/planning_prejepa.py
    trainer_config_style: hydra
    training_profiles:
      pusht: null
      cube: null
      tworoom: null
      insertpeg: null
    planning_config_dir: prejepa
    planner_config_style: hydra
    planner_seed_style: override
  driftworld:
    aliases: [driftworldmodel]
    capabilities: [train, predict, plan]
    families: [pusht, cube, tworoom, insert_peg]
    evaluation_id: driftworld
    trainer: scripts/train/train_driftworld.py
    predictor: scripts/eval/eval.py
    planner: scripts/plan/planning_driftworld.py
    training_config_dir: driftworld
    training_config_suffix: _lewm
    trainer_config_style: argparse
    training_profiles:
      pusht: scripts/train/config/driftworld/pusht_lewm.yaml
      cube: scripts/train/config/driftworld/cube_lewm.yaml
      tworoom: scripts/train/config/driftworld/tworoom_lewm.yaml
      insertpeg: scripts/train/config/driftworld/insert_peg_lewm.yaml
    planning_config_dir: driftworld
    planning_config_suffix: _lewm
    planner_config_style: argparse
    planner_seed_style: triple
  irasim:
    aliases: []
    capabilities: [train, predict, plan]
    families: [pusht, cube, tworoom, insert_peg]
    evaluation_id: irasim
    trainer: scripts/train/train_irasim.py
    predictor: scripts/eval/eval.py
    planner: scripts/plan/planning_irasim.py
    training_config_dir: irasim
    trainer_config_style: argparse
    training_profiles:
      pusht: scripts/train/config/irasim/pusht.yaml
      cube: scripts/train/config/irasim/cube.yaml
      tworoom: scripts/train/config/irasim/tworoom.yaml
      insertpeg: scripts/train/config/irasim/insert_peg.yaml
    planning_config_dir: irasim
    planner_config_style: argparse
    planner_seed_style: triple
  toy-adaln:
    aliases: [adaln, adaln_predictor]
    capabilities: [train, predict, plan]
    families: [pusht, cube, tworoom, insert_peg]
    evaluation_id: adaln_predictor
    trainer: scripts/train/train_toy_predictor.py
    predictor: scripts/eval/eval.py
    planner: scripts/plan/planning_toy.py
    trainer_config_style: hydra
    training_profiles:
      pusht: scripts/train/config/toy_predictors/train.yaml
      cube: scripts/train/config/toy_predictors/train.yaml
      tworoom: scripts/train/config/toy_predictors/train.yaml
      insertpeg: scripts/train/config/toy_predictors/train.yaml
    planning_config_dir: toy_predictors
    planner_config_style: hydra
    planner_seed_style: override
    planning_checkpoint_key: model.checkpoint_path
  toy-action-duplicate:
    aliases: [action_duplicate, action_duplicated_predictor]
    capabilities: [train, predict, plan]
    families: [pusht, cube, tworoom, insert_peg]
    evaluation_id: action_duplicated_predictor
    trainer: scripts/train/train_toy_predictor.py
    predictor: scripts/eval/eval.py
    planner: scripts/plan/planning_toy.py
    trainer_config_style: hydra
    training_profiles:
      pusht: scripts/train/config/toy_predictors/train.yaml
      cube: scripts/train/config/toy_predictors/train.yaml
      tworoom: scripts/train/config/toy_predictors/train.yaml
      insertpeg: scripts/train/config/toy_predictors/train.yaml
    planning_config_dir: toy_predictors
    planner_config_style: hydra
    planner_seed_style: override
    planning_checkpoint_key: model.checkpoint_path
  toy-driftworld:
    aliases: [toy_driftworld]
