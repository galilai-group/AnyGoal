    planner: anygoal.runners.plan.planning_driftworld
    training_config_dir: driftworld
    training_config_suffix: _lewm
    trainer_config_style: argparse
    training_profiles:
      pusht: train/driftworld/pusht_lewm.yaml
      cube: train/driftworld/cube_lewm.yaml
