schema_version: 1

datasets:
  pusht:
    aliases: [push_t]
    family: pusht
    filename: pusht_expert_train.h5
    environment: swm/PushT-v1
    evaluation_id: pusht
    config_stem: pusht
    schema: stable-worldmodel-hdf5-v1
    source: external
  avoidt:
    aliases: [avoid_t]
    family: pusht
    filename: avoidt_test.h5
    environment: anygoal/AvoidT-v1
    evaluation_id: avoidt
    config_stem: avoidt
    schema: stable-worldmodel-hdf5-v1
    source: generated
    collector: anygoal.collections.avoidt
    default_seed: 0
  stackt:
    aliases: [stack_t]
    family: pusht
    filename: stackt_test.h5
    environment: anygoal/StackT-v2
    evaluation_id: stackt
    config_stem: stackt
    planning_stems: {irasim: stackt_v2}
    schema: stable-worldmodel-hdf5-v1
    source: generated
    collector: anygoal.collections.stackt
    default_seed: 0
  pusht-antigoal:
    aliases: [pusht_antigoal, push_t_antigoal]
    family: pusht
    filename: pusht_antigoal_test.h5
    environment: anygoal/PushTAntigoal-v3
    evaluation_id: pusht_antigoal
    config_stem: push_t_antigoal
    planning_stems: {irasim: push_t_antigoal_v3}
    schema: stable-worldmodel-hdf5-v1
    source: generated
    collector: anygoal.collections.pusht_antigoal
    default_seed: 0
  cube:
    aliases: [cube_single]
    family: cube
    filename: cube_single_expert.h5
    environment: ogbench/cube-single-play-v0
    evaluation_id: cube
    config_stem: cube
    schema: stable-worldmodel-hdf5-v1
    source: external
  cubehop:
    aliases: [cube_hop]
    family: cube
    filename: cube_hop_test.h5
    environment: anygoal/CubeHop-v0
    evaluation_id: cubehop
    config_stem: cube_hop
    schema: stable-worldmodel-hdf5-v1
    source: generated
    collector: anygoal.collections.cube_hop
    default_seed: 0
  cubediagonal:
    aliases: [cube_diagonal]
    family: cube
    filename: cube_diagonal_test.h5
    environment: anygoal/CubeDiagonal-v0
    evaluation_id: cube_diagonal
    config_stem: cube_diagonal
    schema: stable-worldmodel-hdf5-v1
    source: generated
    collector: anygoal.collections.cube_diagonal
    default_seed: 10065
  insertpeg:
    aliases: [insert_peg]
    family: insert_peg
    filename: insert_peg_weak_expert_train.h5
    environment: anygoal/InsertPeg-v0
    evaluation_id: insert_peg
    config_stem: insert_peg
    schema: stable-worldmodel-hdf5-v1
    source: external
  avoid_peg:
    aliases: [avoid-peg]
    family: insert_peg
    filename: avoid_peg_test.h5
    environment: anygoal/InsertPeg-v0
    evaluation_id: avoid_peg
    config_stem: insert_peg
    schema: stable-worldmodel-hdf5-v1
    source: generated
    collector: anygoal.collections.avoid_peg
    default_seed: 20260914
  extractpeg:
    aliases: [extract-peg, extract_peg]
    family: insert_peg
    filename: extract_peg_test.h5
    environment: anygoal/InsertPeg-v0
    evaluation_id: extract_peg
    config_stem: insert_peg
    schema: stable-worldmodel-hdf5-v1
    source: generated
    collector: anygoal.collections.extract_peg
    default_seed: 20260915
  tworoom:
    aliases: [two_room]
    family: tworoom
    filename: tworoom.h5
    environment: swm/TwoRoom-v1
    evaluation_id: tworoom
    config_stem: tworoom
    schema: stable-worldmodel-hdf5-v1
    source: external
  tworoom_route:
    aliases: [tworoom-route, tworoom_triangle, tworoom_triangles, tworoom_route_test]
    family: tworoom
    filename: tworoom_route_test.h5
