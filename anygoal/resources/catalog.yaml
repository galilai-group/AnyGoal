models:
  lewm:
    aliases: []
    capabilities: [train, rollout, plan]
    families: [pusht, cube, tworoom, insert_peg]
    evaluation_id: lewm
    trainer: anygoal.runners.train.train_lewm
    rollout_runner: anygoal.runners.rollout
    planner: anygoal.runners.plan.planning_lewm
    trainer_config_style: hydra
    training_profiles:
      pusht: null
      cube: null
      tworoom: null
      insertpeg: null
    planning_config_dir: lewm
    planner_config_style: hydra
    planner_seed_style: override
  sensorimotor:
    aliases: [sensorimotor_wm]
    capabilities: [train, rollout, plan]
    families: [pusht, cube, tworoom, insert_peg]
